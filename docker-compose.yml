version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ilms_db
    ports:
      - "5432:5432"
    volumes:
      - ilms_pgdata:/var/lib/postgresql/data

volumes:
  ilms_pgdata: